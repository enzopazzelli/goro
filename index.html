<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heladería Goro — Sistema de gestión</title>

<!--
  ============================================================================
  MOCKUP / DEMO — Sistema de gestión para heladería artesanal
  ============================================================================
  Archivo único. Sin instalación, sin base de datos, sin backend: todos los
  datos viven en memoria y se reinician al recargar la página.
  Sirve para que el cliente TOQUE el sistema y entienda cómo se siente,
  no para vender de verdad.

  Qué sí funciona de verdad acá adentro:
    · Vender: elegís formato → sabores → cobrás. Descuenta kilos de la
      cubeta de cada sabor y unidades de insumos.
    · El historial refleja lo vendido, y anular una venta devuelve los
      kilos a las cubetas.
    · La caja suma lo cobrado en efectivo y calcula la diferencia al cerrar.
    · El panel se recalcula solo con lo que se vendió en la sesión.

  DECISIONES DE DISEÑO (para no perderlas cuando esto pase a Next.js)
  ---------------------------------------------------------------------------
  Dirección estética: SETENTOSO CÁLIDO — arcos, curvas anchas, tipografía
  geométrica, bandas de color. Es la dirección que le corresponde al rubro,
  pero con la paleta corrida al mundo real del cliente: pistacho y dulce de
  leche sobre crema, en vez del naranja quemado de manual (que además es
  vecino del default "crema + terracota" que produce toda la IA).

  Rasgo prestado (uno solo) del CARTEL DE MERCADO: el total a cobrar tratado
  como pieza gráfica — enorme, con el signo chico. En un mostrador con fila,
  el número que importa se tiene que leer desde un metro de distancia.

  Señal característica: el color real de cada sabor es un dato del sistema y
  aparece igual en todos lados (venta, stock, ticket, panel), y la cubeta se
  dibuja como el pozzetti lleno hasta el nivel de kilos que quedan. De un
  vistazo, sin leer un número, se ve qué se está por acabar.

  Es un sistema de gestión, no una landing: la identidad varía (color,
  tipografía, forma, densidad), los patrones de interacción NO. Barra
  lateral fija, tablas, modales. La previsibilidad acá es una función.

  Convención del proyecto: todo el código en español, y los comentarios
  explican el POR QUÉ, no el qué.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   TOKENS — todo lo que cambiaría de una heladería a otra vive acá.
   Cambiar la identidad visual del comercio = tocar solo este bloque.
   ============================================================================ */
:root{
  /* --- Color. Paleta sacada del mostrador real: crema americana de fondo,
     chocolate como tinta, pistacho y dulce de leche como acentos. --- */
  --crema:        #F7F1E4;   /* fondo del área de trabajo */
  --crema-honda:  #EDE4D1;   /* filas alternas, superficies hundidas */
  --nata:         #FFFCF6;   /* tarjetas y tablas */
  --cacao:        #2A1B12;   /* tinta principal — 14.7:1 sobre crema */
  --cacao-suave:  #6E5F4E;   /* texto secundario — 5.5:1 sobre crema */
  --pistacho:     #3F6B3A;   /* acento principal — 6.1:1 con la nata encima */
  --pistacho-cl:  #E4EDDC;   /* fondo de estado activo */
  --dulce:        #C97B34;   /* acento secundario: destacar, totales */
  --dulce-tinta:  #8A5620;   /* el dulce, oscurecido para usar como texto */
  --dulce-cl:     #F8ECD9;
  --frutilla:     #A83232;   /* faltante, deuda, anulado */
  --frutilla-cl:  #F9E5E2;
  --filete:       #E2D7C0;   /* bordes */

  /* --- Tipografía. Tres roles, ni uno más. --- */
  --f-display: 'Familjen Grotesk', system-ui, sans-serif;  /* títulos, marca */
  --f-texto:   'Hanken Grotesk', system-ui, sans-serif;    /* todo el cuerpo */
  --f-dato:    'DM Mono', ui-monospace, monospace;         /* plata, kilos, códigos */

  /* --- Escala 1.25 sobre base 16. Ratio bajo: es un panel de trabajo,
     no una portada; el drama tipográfico acá molesta. --- */
  --t--2: .6875rem;  --t--1: .8125rem;  --t-0: .9375rem;
  --t-1:  1.1719rem; --t-2:  1.4648rem; --t-3: 1.8311rem;
  --t-4:  2.2888rem; --t-5:  clamp(2.6rem, 1.4rem + 4vw, 3.5rem);

  /* --- Espacio, base 8 --- */
  --e-1: .5rem;  --e-2: 1rem;   --e-3: 1.5rem;
  --e-4: 2rem;   --e-6: 3rem;   --e-8: 4rem;

  /* --- Forma. El arco es el elemento estructural de toda la interfaz. --- */
  --radio:      18px;
  --radio-ch:   10px;
  --arco:       999px 999px var(--radio-ch) var(--radio-ch);
  --borde:      1px solid var(--filete);
  --sombra:     0 1px 0 rgba(42,27,18,.04), 0 8px 24px -18px rgba(42,27,18,.5);

  /* --- Movimiento: suave y lento, propio de la dirección setentosa.
     Nada se mueve sin que el usuario lo pida. --- */
  --curva: cubic-bezier(.2,0,0,1);
  --dur:   200ms;

  /* --- Densidad de listas. El mostrador en hora pico quiere ver más
     filas; la oficina quiere leer cómodo. --- */
  --fila-y: .7rem;
}
[data-densidad="compacta"]{ --fila-y: .35rem }

*{ box-sizing:border-box; margin:0; padding:0 }
html{ -webkit-text-size-adjust:100% }

body{
  font-family:var(--f-texto);
  font-size:var(--t-0);
  line-height:1.45;
  color:var(--cacao);
  background:var(--crema);
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,h4{ font-family:var(--f-display); font-weight:700; line-height:1.15 }

button{ font:inherit; color:inherit; cursor:pointer; border:0; background:none }
input,select,textarea{ font:inherit; color:inherit }
table{ border-collapse:collapse; width:100% }

/* Piso de accesibilidad: el foco de teclado se tiene que ver SIEMPRE. */
:focus-visible{ outline:3px solid var(--pistacho); outline-offset:2px; border-radius:4px }

@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; scroll-behavior:auto !important }
}

/* Solo para lectores de pantalla */
.oculto{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* ============================================================================
   ESTRUCTURA — barra lateral fija + área de trabajo
   ============================================================================ */
.app{ display:flex; min-height:100vh }

.rail{
  width:224px; flex-shrink:0;
  background:var(--cacao); color:var(--crema);
  padding:var(--e-2) var(--e-2) var(--e-3);
  display:flex; flex-direction:column; gap:var(--e-3);
  position:sticky; top:0; height:100vh; overflow-y:auto;
}

/* El arco de la marca: primera aparición del gesto que se repite en todo
   el sistema (cubetas, cabeceras de bloque, botones de sabor). */
.marca{
  background:var(--pistacho);
  border-radius:var(--arco);
  padding:var(--e-3) var(--e-2) var(--e-2);
  text-align:center;
}
.marca__nombre{
  font-family:var(--f-display); font-weight:700;
  font-size:var(--t-2); letter-spacing:-.01em; color:#FFFCF6;
}
.marca__bajada{
  font-family:var(--f-dato); font-size:var(--t--2);
  text-transform:uppercase; letter-spacing:.16em;
  color:#D6E4CC; margin-top:2px;
}

.nav{ display:flex; flex-direction:column; gap:2px }
.nav__grupo{
  font-family:var(--f-dato); font-size:var(--t--2);
  text-transform:uppercase; letter-spacing:.14em;
  color:#9A8A78; padding:var(--e-2) var(--e-1) var(--e-1);
}
.nav__item{
  display:flex; align-items:center; gap:.6rem; width:100%;
  padding:.55rem .7rem; border-radius:999px;
  color:#E8DECD; text-align:left;
  transition:background var(--dur) var(--curva), color var(--dur) var(--curva);
}
.nav__item:hover{ background:#3B2A1E; color:#FFFCF6 }
.nav__item[aria-current="page"]{ background:var(--crema); color:var(--cacao); font-weight:600 }
.nav__icono{ width:20px; text-align:center; font-size:1.05rem; flex-shrink:0 }
.nav__globo{
  margin-left:auto; font-family:var(--f-dato); font-size:var(--t--2);
  background:var(--frutilla); color:#fff; border-radius:999px; padding:1px 7px;
}

.rail__pie{ margin-top:auto; border-top:1px solid #3B2A1E; padding-top:var(--e-2) }
.usuario{ display:flex; align-items:center; gap:.6rem }
.usuario__foto{
  width:34px; height:34px; flex-shrink:0; border-radius:999px;
  background:var(--dulce); color:var(--cacao);
  display:grid; place-items:center; font-family:var(--f-display); font-weight:700;
}
.usuario__nombre{ font-weight:600; font-size:var(--t--1) }
.usuario__rol{ font-family:var(--f-dato); font-size:var(--t--2); color:#9A8A78 }

.obra{ flex:1; min-width:0; display:flex; flex-direction:column }

.barra{
  display:flex; align-items:center; gap:var(--e-2);
  padding:var(--e-2) var(--e-3);
  border-bottom:var(--borde); background:var(--crema);
  position:sticky; top:0; z-index:20;
}
.barra__titulo{ font-size:var(--t-2) }
.barra__sub{ font-size:var(--t--1); color:var(--cacao-suave) }
.barra__der{ margin-left:auto; display:flex; align-items:center; gap:var(--e-1); flex-wrap:wrap }

.vista{ padding:var(--e-3); display:none; flex:1 }
.vista[data-activa]{ display:block }

/* ============================================================================
   PIEZAS REUTILIZABLES
   ============================================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  padding:.5rem 1rem; border-radius:999px;
  font-weight:600; font-size:var(--t--1); white-space:nowrap;
  border:1px solid transparent;
  transition:background var(--dur) var(--curva), color var(--dur) var(--curva), border-color var(--dur) var(--curva);
}
.btn--principal{ background:var(--pistacho); color:#FFFCF6 }
.btn--principal:hover{ background:#33582F }
.btn--suave{ background:var(--nata); color:var(--cacao); border-color:var(--filete) }
.btn--suave:hover{ background:var(--crema-honda) }
.btn--fantasma{ color:var(--cacao-suave) }
.btn--fantasma:hover{ background:var(--crema-honda); color:var(--cacao) }
.btn--peligro{ background:var(--frutilla-cl); color:var(--frutilla); border-color:#EBC9C4 }
.btn--peligro:hover{ background:var(--frutilla); color:#fff }
.btn--grande{ padding:.85rem 1.6rem; font-size:var(--t-0) }
.btn--bloque{ width:100% }
.btn:disabled{ opacity:.45; cursor:not-allowed }

.tarjeta{
  background:var(--nata); border:var(--borde); border-radius:var(--radio);
  box-shadow:var(--sombra);
}
.tarjeta__cab{ display:flex; align-items:center; gap:var(--e-1); padding:var(--e-2) var(--e-2) .6rem }
.tarjeta__tit{ font-size:var(--t-1) }
.tarjeta__cuerpo{ padding:var(--e-2) }

/* Cabecera con arco: el mismo gesto de la marca, más chico. Encabeza los
   bloques que son "una unidad de trabajo" (carrito, arqueo, ficha). */
.arco-cab{
  background:var(--cacao); color:var(--crema);
  border-radius:var(--arco);
  padding:var(--e-2) var(--e-2) .9rem;
  text-align:center;
}
.arco-cab h3{ font-size:var(--t-1); color:#FFFCF6 }
.arco-cab p{
  font-family:var(--f-dato); font-size:var(--t--2); color:#B5A492;
  text-transform:uppercase; letter-spacing:.14em;
}

.insignia{
  display:inline-flex; align-items:center; gap:.3rem;
  font-family:var(--f-dato); font-size:var(--t--2);
  text-transform:uppercase; letter-spacing:.08em;
  padding:.15rem .55rem; border-radius:999px; white-space:nowrap;
}
.insignia--ok{ background:var(--pistacho-cl); color:#2C4C28 }
.insignia--alerta{ background:var(--dulce-cl); color:var(--dulce-tinta) }
.insignia--mal{ background:var(--frutilla-cl); color:var(--frutilla) }
.insignia--neutra{ background:var(--crema-honda); color:var(--cacao-suave) }

/* Los números siempre en mono tabular: así las columnas de plata se
   alinean y se pueden comparar sin leerlas una por una. */
.dato{ font-family:var(--f-dato); font-variant-numeric:tabular-nums }
.plata{ font-family:var(--f-dato); font-variant-numeric:tabular-nums; white-space:nowrap }
.plata__signo{ font-size:.62em; opacity:.55; margin-right:.08em; vertical-align:.06em }

.campo{ display:flex; flex-direction:column; gap:.3rem }
.campo__et{
  font-family:var(--f-dato); font-size:var(--t--2);
  text-transform:uppercase; letter-spacing:.1em; color:var(--cacao-suave);
}
.campo input, .campo select, .campo textarea{
  background:var(--nata); border:var(--borde); border-radius:var(--radio-ch);
  padding:.55rem .7rem; width:100%;
}
.campo input:focus, .campo select:focus{
  outline:none; border-color:var(--pistacho); box-shadow:0 0 0 3px var(--pistacho-cl);
}
.campo--error input{ border-color:var(--frutilla) }
.campo__error{ font-size:var(--t--1); color:var(--frutilla) }

.buscador{ position:relative; flex:1; min-width:170px; max-width:420px }
.buscador input{ width:100%; background:var(--nata); border:var(--borde); border-radius:999px; padding:.5rem .9rem .5rem 2.2rem }
.buscador::before{
  content:"⌕"; position:absolute; left:.85rem; top:50%;
  transform:translateY(-50%); color:var(--cacao-suave); font-size:1.1rem;
}

.pildoras{ display:flex; gap:.35rem; flex-wrap:wrap }
.pildora{
  padding:.3rem .8rem; border-radius:999px; border:var(--borde);
  background:var(--nata); font-size:var(--t--1); color:var(--cacao-suave);
  transition:background var(--dur) var(--curva), color var(--dur) var(--curva);
}
.pildora[aria-pressed="true"]{ background:var(--cacao); color:var(--crema); border-color:var(--cacao) }

.tabla-caja{ background:var(--nata); border:var(--borde); border-radius:var(--radio); overflow:hidden; box-shadow:var(--sombra) }
.tabla-scroll{ overflow-x:auto }
.tabla th{
  text-align:left; font-family:var(--f-dato); font-weight:500;
  font-size:var(--t--2); text-transform:uppercase; letter-spacing:.1em;
  color:var(--cacao-suave); background:var(--crema-honda);
  padding:.6rem var(--e-2); white-space:nowrap;
}
.tabla td{ padding:var(--fila-y) var(--e-2); border-top:1px solid var(--filete); vertical-align:middle }
.tabla tbody tr:hover{ background:var(--crema) }
.tabla .num{ text-align:right }
.tabla .acciones{ text-align:right; white-space:nowrap }

/* Estado vacío diseñado a propósito: dice qué pasó y cuál es el próximo paso. */
.vacio{ padding:var(--e-6) var(--e-2); text-align:center; color:var(--cacao-suave) }
.vacio__icono{ font-size:2.2rem; display:block; margin-bottom:.4rem; opacity:.6 }
.vacio__tit{ font-family:var(--f-display); font-weight:600; font-size:var(--t-1); color:var(--cacao) }
.vacio p{ font-size:var(--t--1); margin-top:.2rem }

/* ============================================================================
   LA SEÑAL DE LA CASA — el sabor como color, la cubeta como nivel
   ============================================================================
   Cada sabor tiene el color real del helado y ese color es un dato del
   sistema: el mismo punto aparece en la venta, en el stock, en el ticket
   y en el panel. Es lo que hace que este sistema sea de una heladería y
   no de "un comercio" genérico.
   ------------------------------------------------------------------------- */
.punto{
  width:14px; height:14px; border-radius:999px; flex-shrink:0;
  border:1px solid rgba(42,27,18,.22);
  display:inline-block; vertical-align:-2px;
}
.punto--gr{ width:22px; height:22px }

/* La cubeta: dibujo del pozzetti visto de frente, lleno hasta los kilos
   que quedan. Se lee sin leer el número. */
.cubeta{
  position:relative; width:34px; height:44px; flex-shrink:0;
  border-radius:var(--arco);
  background:var(--crema-honda);
  border:1px solid var(--filete);
  overflow:hidden;
}
.cubeta__nivel{
  position:absolute; left:0; right:0; bottom:0;
  transition:height var(--dur) var(--curva);
}
.cubeta--baja{ border-color:var(--frutilla); box-shadow:0 0 0 2px var(--frutilla-cl) }

/* ============================================================================
   PUNTO DE VENTA
   ============================================================================ */
.pos{ display:grid; grid-template-columns:1fr 350px; gap:var(--e-3); align-items:start }

.formatos{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:.6rem }
.formato{
  border:var(--borde); background:var(--nata);
  border-radius:var(--arco); padding:var(--e-2) .7rem .8rem;
  text-align:center; transition:background var(--dur) var(--curva), border-color var(--dur) var(--curva);
}
.formato:hover{ background:var(--crema-honda) }
.formato[aria-pressed="true"]{ background:var(--cacao); color:var(--crema); border-color:var(--cacao) }
.formato__nombre{ font-family:var(--f-display); font-weight:600; font-size:var(--t-0) }
.formato__det{ font-family:var(--f-dato); font-size:var(--t--2); opacity:.7; margin-top:.15rem }
.formato__precio{ font-family:var(--f-dato); font-size:var(--t-0); margin-top:.35rem }

.sabores{ display:grid; grid-template-columns:repeat(auto-fill, minmax(148px,1fr)); gap:.5rem }
.sabor{
  display:flex; align-items:center; gap:.55rem;
  border:var(--borde); background:var(--nata);
  border-radius:999px 999px var(--radio-ch) var(--radio-ch);
  padding:.55rem .8rem; text-align:left;
  transition:background var(--dur) var(--curva), border-color var(--dur) var(--curva);
}
.sabor:hover:not(:disabled){ background:var(--crema-honda) }
.sabor[aria-pressed="true"]{ border-color:var(--pistacho); background:var(--pistacho-cl) }
.sabor:disabled{ opacity:.4; cursor:not-allowed }
.sabor__nombre{ font-size:var(--t--1); font-weight:500; line-height:1.2 }
.sabor__resto{ font-family:var(--f-dato); font-size:var(--t--2); color:var(--cacao-suave) }
.sabor__marca{ margin-left:auto; font-weight:700; color:var(--pistacho) }

.carrito{ position:sticky; top:76px; display:flex; flex-direction:column; gap:0 }
.carrito__cuerpo{
  background:var(--nata); border:var(--borde); border-top:0;
  border-radius:0 0 var(--radio) var(--radio); box-shadow:var(--sombra);
}
.carrito__lineas{ max-height:44vh; overflow-y:auto }
.linea{ display:flex; gap:.6rem; padding:.65rem var(--e-2); border-bottom:1px solid var(--filete) }
.linea__cuerpo{ flex:1; min-width:0 }
.linea__tit{ font-weight:600; font-size:var(--t--1) }
.linea__sabores{ font-size:var(--t--2); color:var(--cacao-suave); margin-top:.1rem }
.linea__quitar{ color:var(--cacao-suave); font-size:1.1rem; line-height:1; padding:0 .2rem }
.linea__quitar:hover{ color:var(--frutilla) }
.carrito__pie{ padding:var(--e-2); border-top:2px solid var(--cacao) }

/* El total como pieza gráfica — el rasgo prestado del cartel de mercado.
   En un mostrador con fila se tiene que leer desde lejos. */
.total{ display:flex; align-items:baseline; justify-content:space-between; gap:.5rem }
.total__et{ font-family:var(--f-dato); font-size:var(--t--2); text-transform:uppercase; letter-spacing:.14em; color:var(--cacao-suave) }
.total__num{ font-family:var(--f-dato); font-weight:500; font-size:var(--t-4); letter-spacing:-.02em; font-variant-numeric:tabular-nums }
.total__num .plata__signo{ font-size:.5em }

/* ============================================================================
   PANEL
   ============================================================================ */
.grilla-kpi{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:var(--e-2) }
.kpi{ background:var(--nata); border:var(--borde); border-radius:var(--radio); padding:var(--e-2); box-shadow:var(--sombra) }
.kpi__et{ font-family:var(--f-dato); font-size:var(--t--2); text-transform:uppercase; letter-spacing:.12em; color:var(--cacao-suave) }
.kpi__num{ font-family:var(--f-dato); font-size:var(--t-3); font-variant-numeric:tabular-nums; margin-top:.2rem; letter-spacing:-.02em }
.kpi__pie{ font-size:var(--t--1); color:var(--cacao-suave); margin-top:.15rem }
.kpi--destacado{ background:var(--cacao); color:var(--crema); border-color:var(--cacao) }
.kpi--destacado .kpi__et, .kpi--destacado .kpi__pie{ color:#B5A492 }

.grilla-2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--e-2); margin-top:var(--e-2) }

/* Ranking de sabores: barra proporcional en el color del propio sabor. */
.rank{ display:flex; align-items:center; gap:.6rem; padding:.4rem 0 }
.rank__nom{ width:140px; flex-shrink:0; font-size:var(--t--1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.rank__barra{ flex:1; height:14px; background:var(--crema-honda); border-radius:999px; overflow:hidden }
.rank__relleno{ height:100%; border-radius:999px }
.rank__val{ font-family:var(--f-dato); font-size:var(--t--1); width:62px; text-align:right }

/* Ventas por hora: una heladería vende de noche, y verlo importa. */
.horas{ display:flex; align-items:flex-end; gap:3px; height:110px; margin-top:.5rem }
.hora{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:3px; height:100% }
.hora__barra{ width:100%; background:var(--dulce); border-radius:6px 6px 2px 2px; min-height:2px }
.hora__et{ font-family:var(--f-dato); font-size:9px; color:var(--cacao-suave) }

/* ============================================================================
   MODALES
   ============================================================================ */
.modal-fondo{
  position:fixed; inset:0; background:rgba(42,27,18,.55);
  display:none; align-items:center; justify-content:center;
  padding:var(--e-2); z-index:60;
}
.modal-fondo[data-abierto]{ display:flex }
.modal{
  background:var(--crema); border-radius:var(--radio);
  width:100%; max-width:460px; max-height:92vh; overflow-y:auto;
  box-shadow:0 30px 70px -20px rgba(42,27,18,.6);
}
.modal--ancho{ max-width:620px }
.modal__cuerpo{ padding:var(--e-2) }
.modal__pie{ display:flex; gap:.5rem; justify-content:flex-end; padding:0 var(--e-2) var(--e-2); flex-wrap:wrap }

/* Aviso flotante de confirmación */
.aviso{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--cacao); color:var(--crema);
  padding:.7rem 1.2rem; border-radius:999px; z-index:80;
  box-shadow:0 12px 30px -10px rgba(42,27,18,.7);
  font-size:var(--t--1); display:none; max-width:92vw; text-align:center;
}
.aviso[data-visible]{ display:block }

/* Ticket del historial: se lee como un ticket, no como un formulario. */
.ticket{ background:var(--nata); border:var(--borde); border-radius:var(--radio-ch); padding:var(--e-2); font-family:var(--f-dato); font-size:var(--t--1) }
.ticket__fila{ display:flex; justify-content:space-between; gap:1rem; padding:.15rem 0 }
.ticket__sep{ border-top:1px dashed var(--filete); margin:.5rem 0 }

/* Matriz de permisos por rol */
.permisos td, .permisos th{ text-align:center }
.permisos td:first-child, .permisos th:first-child{ text-align:left }
.si{ color:var(--pistacho); font-weight:700 }
.no{ color:#C5B9A6 }

/* ============================================================================
   RESPONSIVE — la barra lateral pasa abajo, todo se apila.
   Probado hasta 360px, que es donde de verdad se usa en el mostrador.
   ============================================================================ */
.movil{ display:none }

@media (max-width:1080px){
  .pos{ grid-template-columns:1fr }
  .carrito{ position:static }
  .grilla-2{ grid-template-columns:1fr }
}

@media (max-width:820px){
  .rail{ display:none }
  .app{ flex-direction:column }
  .vista{ padding:var(--e-2); padding-bottom:84px }
  .barra{ padding:.7rem var(--e-2) }
  .barra__titulo{ font-size:var(--t-1) }

  .movil{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:var(--cacao); padding:.4rem .3rem calc(.4rem + env(safe-area-inset-bottom));
    justify-content:space-around; gap:2px; overflow-x:auto;
  }
  .movil__item{
    display:flex; flex-direction:column; align-items:center; gap:1px;
    color:#B5A492; padding:.35rem .5rem; border-radius:var(--radio-ch);
    font-size:9px; font-family:var(--f-dato); text-transform:uppercase; letter-spacing:.06em;
  }
  .movil__item span{ font-size:1.15rem; line-height:1 }
  .movil__item[aria-current="page"]{ color:var(--crema); background:#3B2A1E }
}

@media (max-width:420px){
  .formatos{ grid-template-columns:1fr 1fr }
  .sabores{ grid-template-columns:1fr 1fr }
  .rank__nom{ width:92px }
  .total__num{ font-size:var(--t-3) }
  .barra__der .btn span.et{ display:none }
}
</style>
</head>

  <!-- Navegación móvil: los tres módulos del mostrador primero, porque

<script>
/* ============================================================================
   DATOS DE DEMO
   ============================================================================
   Todo esto sería la base de datos. Los valores son verosímiles a propósito:
   un cliente reconoce enseguida si los sabores, los formatos o los precios
   están inventados de escritorio, y ahí deja de creer en la demo.
   ------------------------------------------------------------------------- */

/* El color es un dato del sabor, no una decoración: se usa igual en el
   punto de venta, en el stock, en el ticket y en el panel. */
const SABORES = [
  { id:'s01', nombre:'Dulce de leche',            cat:'Dulce de leche', color:'#C08A45', kg:4.1, cubeta:5.5, min:1.5, costoKg:4200 },

  { id:'s10', nombre:'Vainilla',                  cat:'Crema',          color:'#F2E6C8', kg:5.0, cubeta:5.5, min:1.2, costoKg:3900 },
  { id:'s11', nombre:'Americana',                 cat:'Crema',          color:'#E7D9BE', kg:2.6, cubeta:5.5, min:1.2, costoKg:3900 },
  { id:'s12', nombre:'Banana split',              cat:'Crema',          color:'#E9D089', kg:1.4, cubeta:5.5, min:1.2, costoKg:4500 },
  { id:'s13', nombre:'Menta granizada',           cat:'Crema',          color:'#A8D5C0', kg:2.1, cubeta:5.5, min:1.2, costoKg:4400 },
  { id:'s14', nombre:'Pistacho',                  cat:'Crema',          color:'#8FAE5B', kg:0.9, cubeta:5.5, min:1.2, costoKg:7200 },
  { id:'s15', nombre:'Frutilla a la crema',       cat:'Frutal',         color:'#E1798A', kg:3.6, cubeta:5.5, min:1.2, costoKg:4300 },
  { id:'s16', nombre:'Limón',                     cat:'Al agua',        color:'#EFE28A', kg:2.4, cubeta:4.5, min:1.0, costoKg:2900 },
  { id:'s17', nombre:'Frambuesa',                 cat:'Al agua',        color:'#B33A5B', kg:1.1, cubeta:4.5, min:1.0, costoKg:3400 },
  { id:'s18', nombre:'Naranja',                   cat:'Al agua',        color:'#E89A45', kg:3.2, cubeta:4.5, min:1.0, costoKg:2900 },
  { id:'s19', nombre:'Ananá',                     cat:'Al agua',        color:'#EBD46A', kg:0.4, cubeta:4.5, min:1.0, costoKg:3100 },
  { id:'s20', nombre:'Maracuyá',                  cat:'Al agua',        color:'#E7B02F', kg:2.0, cubeta:4.5, min:1.0, costoKg:3600 },
];

/* Los formatos son el corazón del negocio: acá el producto no es "una
   unidad", es un peso repartido entre N sabores que elige el cliente.
   Por eso vender descuenta kilos, no piezas. */
const FORMATOS = [
  { id:'f1', nombre:'Cucurucho',   gramos:120,  sabores:1, precio:2200,  insumos:{ cucurucho:1 } },
  { id:'f2', nombre:'Doble',       gramos:180,  sabores:2, precio:2900,  insumos:{ cucurucho:1 } },
  { id:'f3', nombre:'Vasito',      gramos:160,  sabores:2, precio:2700,  insumos:{ vasito:1, cucharita:1 } },
  { id:'f4', nombre:'1/4 kilo',    gramos:250,  sabores:2, precio:6500,  insumos:{ pote250:1, cucharita:2 } },
  { id:'f5', nombre:'1/2 kilo',    gramos:500,  sabores:3, precio:11800, insumos:{ pote500:1, cucharita:4 } },
  { id:'f6', nombre:'1 kilo',      gramos:1000, sabores:4, precio:21000, insumos:{ pote1000:1, cucharita:6 } },
];

const INSUMOS = [
  { id:'cucurucho', nombre:'Cucuruchos',        unidad:'u',  cant:420, min:200, costo:190 },
  { id:'vasito',    nombre:'Vasitos 160g',      unidad:'u',  cant:180, min:150, costo:150 },
  { id:'pote250',   nombre:'Potes 1/4 kg',      unidad:'u',  cant:96,  min:100, costo:320 },
  { id:'pote500',   nombre:'Potes 1/2 kg',      unidad:'u',  cant:140, min:100, costo:420 },
  { id:'pote1000',  nombre:'Potes 1 kg',        unidad:'u',  cant:64,  min:80,  costo:560 },
  { id:'cucharita', nombre:'Cucharitas',        unidad:'u',  cant:1500,min:800, costo:22  },
  { id:'salsa',     nombre:'Salsa de chocolate',unidad:'kg', cant:3.5, min:2,   costo:6800 },
  { id:'servil',    nombre:'Servilletas',       unidad:'u',  cant:2200,min:1000,costo:8   },
];

/* Clientes con cuenta corriente: en una heladería no son "la gente que
   entra", son los kioscos y clubes que compran por mayor y pagan después. */
const CLIENTES = [
  { id:'c1', nombre:'Kiosco El Trébol',        tel:'381 415-2288', saldo:  48500, ultima:'2026-08-22' },
  { id:'c2', nombre:'Club Social y Deportivo', tel:'381 466-0912', saldo: 126000, ultima:'2026-08-19' },
  { id:'c3', nombre:'Rotisería La Nona',       tel:'381 421-7734', saldo:      0, ultima:'2026-08-24' },
  { id:'c4', nombre:'Buffet Escuela N.º 12',   tel:'381 400-3391', saldo:  15200, ultima:'2026-08-11' },
  { id:'c5', nombre:'Confitería Los Tilos',    tel:'381 432-1180', saldo:      0, ultima:'2026-08-23' },
];

const USUARIOS = [
  { id:'u1', nombre:'Gustavo Ordóñez', usuario:'goro',  rol:'Dueño',     activo:true,  ultimo:'hoy 09:12' },
  { id:'u2', nombre:'Ana Ruiz',        usuario:'ana',   rol:'Mostrador', activo:true,  ultimo:'hoy 15:40' },
  { id:'u3', nombre:'Lucas Farías',    usuario:'lucas', rol:'Mostrador', activo:true,  ultimo:'ayer 21:55' },
  { id:'u4', nombre:'Marina Coria',    usuario:'marina',rol:'Mostrador', activo:false, ultimo:'12/07' },
];

const PERMISOS = [
  { accion:'Vender y cobrar',                    dueno:true, mostrador:true  },
  { accion:'Ver el historial del propio turno',  dueno:true, mostrador:true  },
  { accion:'Ver el historial completo',          dueno:true, mostrador:false },
  { accion:'Anular una venta ya cobrada',        dueno:true, mostrador:false },
  { accion:'Abrir y cerrar la caja',             dueno:true, mostrador:true  },
  { accion:'Ver la diferencia del arqueo',       dueno:true, mostrador:false },
  { accion:'Reponer cubetas y cargar insumos',   dueno:true, mostrador:true  },
  { accion:'Cambiar precios y costos',           dueno:true, mostrador:false },
  { accion:'Fiar a un cliente de cuenta',        dueno:true, mostrador:false },
  { accion:'Administrar usuarios',               dueno:true, mostrador:false },
];

/* ============================================================================
   ESTADO EN MEMORIA
   ============================================================================ */
const estado = {
  vista:      'ventas',
  sabores:    SABORES.map(s => ({ ...s })),
  insumos:    INSUMOS.map(i => ({ ...i })),
  clientes:   CLIENTES.map(c => ({ ...c })),
  ventas:     [],            // se llena con lo que se vende en la demo
  carrito:    [],
  formatoSel: null,
  saboresSel: [],
  filtroSabor:'todos',
  buscaSabor: '',
  buscaStock: '',
  tabStock:   'sabores',
  filtroHist: 'todas',
  caja: {
    abierta:  true,
    apertura: 45000,
    hora:     '14:30',
    movimientos: [
      { tipo:'apertura', detalle:'Fondo de caja del turno tarde', monto: 45000, hora:'14:30' },
      { tipo:'gasto',    detalle:'Hielo seco — proveedor',        monto:-12000, hora:'15:05' },
      { tipo:'gasto',    detalle:'Cambio para la caja',           monto: -5000, hora:'16:20' },
    ],
  },
};

/* Ventas anteriores del turno, para que el historial y el panel no arranquen
   vacíos. Un panel en cero no le muestra nada al cliente. */
(function sembrarVentas(){
  const semilla = [
    { h:'15:12', lineas:[['f4',['s01','s04']],['f1',['s16']]],           pago:'efectivo'      },
    { h:'15:40', lineas:[['f6',['s01','s06','s15','s07']]],              pago:'debito'        },
    { h:'16:03', lineas:[['f2',['s14','s04']],['f3',['s13','s10']]],     pago:'efectivo'      },
    { h:'16:35', lineas:[['f5',['s01','s03','s15']]],                    pago:'transferencia' },
    { h:'17:10', lineas:[['f1',['s18']],['f1',['s16']],['f1',['s20']]],  pago:'efectivo'      },
    { h:'17:48', lineas:[['f4',['s02','s06']]],                          pago:'debito'        },
    { h:'18:22', lineas:[['f6',['s01','s04','s07','s15']]],              pago:'efectivo'      },
    { h:'19:05', lineas:[['f5',['s06','s14','s08']],['f1',['s17']]],     pago:'debito'        },
    { h:'19:44', lineas:[['f3',['s15','s10']]],                          pago:'efectivo'      },
    { h:'20:18', lineas:[['f6',['s01','s06','s04','s03']]],              pago:'transferencia' },
    { h:'20:52', lineas:[['f4',['s09','s11']],['f2',['s13','s01']]],     pago:'efectivo'      },
    { h:'21:30', lineas:[['f5',['s01','s15','s07']]],                    pago:'efectivo'      },
  ];
  semilla.forEach((v, i) => {
    const lineas = v.lineas.map(([fid, sids]) => {
      const f = FORMATOS.find(x => x.id === fid);
      return { formato:f.id, nombre:f.nombre, gramos:f.gramos, precio:f.precio, sabores:sids };
    });
    const total = lineas.reduce((a, l) => a + l.precio, 0);
    estado.ventas.push({
      id: 1041 + i, hora: v.h, lineas, total, pago: v.pago,
      cliente: null, anulada: false, cajero: i % 3 === 0 ? 'Lucas' : 'Ana',
    });
  });
})();

/* ============================================================================
   UTILIDADES
   ============================================================================ */
const $  = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

/* El signo va más chico que el número: el ojo tiene que ir a la cifra,
   no al peso. Es el detalle que trae el cartel de mercado. */
const plata = n => '<span class="plata"><span class="plata__signo">$</span>' +
  Math.round(n).toLocaleString('es-AR') + '</span>';

const kilos = n => n.toFixed(n < 10 ? 2 : 1).replace('.', ',') + ' kg';
const sabor = id => estado.sabores.find(s => s.id === id);
const punto = (color, clase = '') =>
  '<span class="punto ' + clase + '" style="background:' + color + '"></span>';

/* Escapar lo que escribe el usuario antes de meterlo en innerHTML.
   En la demo no hay riesgo real, pero la costumbre viaja al código de
   producción, donde sí lo hay. */
const esc = t => String(t).replace(/[&<>"]/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

function avisar(texto){
  const el = $('#aviso');
  el.textContent = texto;
  el.setAttribute('data-visible', '');
  clearTimeout(avisar._t);
  avisar._t = setTimeout(() => el.removeAttribute('data-visible'), 2600);
}

/* Un solo modal para todo el sistema: mismo comportamiento en todos lados
   (Escape cierra, clic afuera cierra, el foco entra al modal). */
function abrirModal(html, ancho = false){
  const caja = $('#modal-caja');
  caja.className = 'modal' + (ancho ? ' modal--ancho' : '');
  caja.innerHTML = html;
  $('#modal').setAttribute('data-abierto', '');
  const primero = caja.querySelector('input, select, button');
  if (primero) primero.focus();
}
function cerrarModal(){ $('#modal').removeAttribute('data-abierto') }

$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') cerrarModal() });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal() });

/* ============================================================================
   NAVEGACIÓN
   ============================================================================ */
const VISTAS = {
  ventas:    { titulo:'Vender',    sub:'Mostrador · turno tarde',           pintar:()=>pintarVentas()    },
  historial: { titulo:'Historial', sub:'Ventas del turno',                  pintar:()=>pintarHistorial() },
  caja:      { titulo:'Caja',      sub:'Apertura, gastos y arqueo',         pintar:()=>pintarCaja()      },
  panel:     { titulo:'Panel',     sub:'Cómo viene el día',                 pintar:()=>pintarPanel()     },
  stock:     { titulo:'Stock',     sub:'Cubetas de sabor e insumos',        pintar:()=>pintarStock()     },
  clientes:  { titulo:'Clientes',  sub:'Cuentas corrientes por mayor',      pintar:()=>pintarClientes()  },
  usuarios:  { titulo:'Usuarios',  sub:'Quién entra y qué puede hacer',     pintar:()=>pintarUsuarios()  },
};

function ir(vista){
  estado.vista = vista;
  $$('.vista').forEach(v => v.removeAttribute('data-activa'));
  $('#vista-' + vista).setAttribute('data-activa', '');
  $$('[data-ir]').forEach(b => {
    if (b.dataset.ir === vista) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  $('#titulo-vista').textContent = VISTAS[vista].titulo;
  $('#sub-vista').textContent    = VISTAS[vista].sub;
  VISTAS[vista].pintar();
  window.scrollTo({ top:0, behavior:'instant' });
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-ir]');
  if (b) ir(b.dataset.ir);
});

/* La densidad es una preferencia de quien atiende, no del diseñador:
   en hora pico se quiere ver más filas de una. */
$('#btn-densidad').addEventListener('click', () => {
  const compacta = document.body.dataset.densidad === 'compacta';
  if (compacta) delete document.body.dataset.densidad;
  else document.body.dataset.densidad = 'compacta';
  avisar(compacta ? 'Filas cómodas' : 'Filas compactas');
});

/* ============================================================================
   MÓDULO: VENDER (punto de venta)
   ============================================================================
   El flujo está pensado para el mostrador, no para una oficina:
   1) tocás el formato (cucurucho, 1/4, 1/2, kilo)
   2) tocás los sabores hasta llenar el cupo del formato
   3) se agrega solo al carrito cuando el cupo se completa
   Nadie escribe nada. Los sabores agotados aparecen deshabilitados: es el
   único momento en que el stock evita un error, y tiene que ser evidente.
   ------------------------------------------------------------------------- */
function pintarVentas(){
  const f = estado.formatoSel;
  const cupo = f ? f.sabores : 0;
  const filtros = ['todos', 'Dulce de leche', 'Chocolate', 'Crema', 'Frutal', 'Al agua'];

  const visibles = estado.sabores.filter(s =>
    (estado.filtroSabor === 'todos' || s.cat === estado.filtroSabor) &&
    s.nombre.toLowerCase().includes(estado.buscaSabor.toLowerCase())
  );

  const html = '' +
  '<div class="pos">' +

    '<div>' +
      '<h2 class="oculto">Armar el pedido</h2>' +

      '<div style="margin-bottom:var(--e-3)">' +
        '<div class="campo__et" style="margin-bottom:.5rem">1 · Formato</div>' +
        '<div class="formatos">' +
          FORMATOS.map(fo =>
            '<button class="formato" data-formato="' + fo.id + '" aria-pressed="' + Boolean(f && f.id === fo.id) + '">' +
              '<div class="formato__nombre">' + fo.nombre + '</div>' +
              '<div class="formato__det">' + fo.gramos + ' g · ' + fo.sabores + ' sabor' + (fo.sabores > 1 ? 'es' : '') + '</div>' +
              '<div class="formato__precio">' + plata(fo.precio) + '</div>' +
            '</button>'
          ).join('') +
        '</div>' +
      '</div>' +

      '<div class="campo__et" style="margin-bottom:.5rem">' +
        '2 · Sabores' +
        (f ? ' <span style="color:var(--dulce-tinta)">— elegí ' + cupo + ', llevás ' + estado.saboresSel.length + '</span>'
           : ' <span style="color:var(--cacao-suave); text-transform:none; letter-spacing:0">— primero elegí el formato</span>') +
      '</div>' +

      '<div style="display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.7rem">' +
        '<div class="buscador"><label class="oculto" for="q-sabor">Buscar sabor</label>' +
          '<input id="q-sabor" type="search" placeholder="Buscar sabor…" value="' + esc(estado.buscaSabor) + '"></div>' +
        '<div class="pildoras">' +
          filtros.map(c => '<button class="pildora" data-fcat="' + c + '" aria-pressed="' +
            (estado.filtroSabor === c) + '">' + (c === 'todos' ? 'Todos' : c) + '</button>').join('') +
        '</div>' +
      '</div>' +

      (visibles.length === 0
        ? '<div class="tabla-caja"><div class="vacio"><span class="vacio__icono" aria-hidden="true">🔍</span>' +
          '<div class="vacio__tit">Ningún sabor con ese nombre</div>' +
          '<p>Probá con menos letras o sacá el filtro de categoría.</p></div></div>'
        : '<div class="sabores">' + visibles.map(s => {
            const elegido = estado.saboresSel.includes(s.id);
            const agotado = s.kg <= 0.05;
            const lleno   = f && estado.saboresSel.length >= cupo && !elegido;
            return '<button class="sabor" data-sabor="' + s.id + '" aria-pressed="' + elegido + '"' +
              (agotado || !f || lleno ? ' disabled' : '') + '>' +
              punto(s.color, 'punto--gr') +
              '<span style="min-width:0">' +
                '<span class="sabor__nombre">' + s.nombre + '</span><br>' +
                '<span class="sabor__resto">' + (agotado ? 'agotado' : kilos(s.kg)) + '</span>' +
              '</span>' +
              (elegido ? '<span class="sabor__marca" aria-hidden="true">✓</span>' : '') +
            '</button>';
          }).join('') + '</div>'
      ) +
    '</div>' +

    /* ---- Carrito ---- */
    '<div class="carrito">' +
      '<div class="arco-cab"><p>Pedido</p><h3>' + estado.carrito.length + ' ítem' + (estado.carrito.length === 1 ? '' : 's') + '</h3></div>' +
      '<div class="carrito__cuerpo">' +
        (estado.carrito.length === 0
          ? '<div class="vacio"><span class="vacio__icono" aria-hidden="true">🍨</span>' +
            '<div class="vacio__tit">Todavía no armaste nada</div>' +
            '<p>Elegí un formato y después los sabores.</p></div>'
          : '<div class="carrito__lineas">' + estado.carrito.map((l, i) =>
              '<div class="linea">' +
                '<div class="linea__cuerpo">' +
                  '<div class="linea__tit">' + l.nombre + ' · ' + plata(l.precio) + '</div>' +
                  '<div class="linea__sabores">' +
                    l.sabores.map(id => punto(sabor(id).color) + ' ' + sabor(id).nombre).join(' · ') +
                  '</div>' +
                '</div>' +
                '<button class="linea__quitar" data-quitar="' + i + '" aria-label="Quitar ' + l.nombre + '">✕</button>' +
              '</div>'
            ).join('') + '</div>'
        ) +
        '<div class="carrito__pie">' +
          '<div class="total">' +
            '<span class="total__et">Total</span>' +
            '<span class="total__num">' + plata(totalCarrito()) + '</span>' +
          '</div>' +
          '<button class="btn btn--principal btn--grande btn--bloque" id="btn-cobrar" style="margin-top:.8rem"' +
            (estado.carrito.length === 0 ? ' disabled' : '') + '>Cobrar</button>' +
          (estado.carrito.length > 0
            ? '<button class="btn btn--fantasma btn--bloque" id="btn-vaciar" style="margin-top:.35rem">Vaciar el pedido</button>'
            : '') +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';

  $('#vista-ventas').innerHTML = html;
  conectarVentas();
}

const totalCarrito = () => estado.carrito.reduce((a, l) => a + l.precio, 0);

function conectarVentas(){
  const v = $('#vista-ventas');

  $$('[data-formato]', v).forEach(b => b.addEventListener('click', () => {
    const f = FORMATOS.find(x => x.id === b.dataset.formato);
    estado.formatoSel = (estado.formatoSel && estado.formatoSel.id === f.id) ? null : f;
    estado.saboresSel = [];
    pintarVentas();
  }));

  $$('[data-sabor]', v).forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.sabor;
    const i  = estado.saboresSel.indexOf(id);
    if (i >= 0) estado.saboresSel.splice(i, 1);
    else estado.saboresSel.push(id);

    /* Cuando el cupo se completa, la línea se agrega sola. Un botón
       "agregar" ahí sería un toque de más por cada helado, y en hora
       pico eso se nota. */
    if (estado.formatoSel && estado.saboresSel.length === estado.formatoSel.sabores){
      const f = estado.formatoSel;
      estado.carrito.push({
        formato:f.id, nombre:f.nombre, gramos:f.gramos,
        precio:f.precio, sabores:[...estado.saboresSel],
      });
      estado.saboresSel = [];
      avisar(f.nombre + ' agregado al pedido');
    }
    pintarVentas();
  }));

  $$('[data-quitar]', v).forEach(b => b.addEventListener('click', () => {
    estado.carrito.splice(+b.dataset.quitar, 1);
    pintarVentas();
  }));

  $$('[data-fcat]', v).forEach(b => b.addEventListener('click', () => {
    estado.filtroSabor = b.dataset.fcat;
    pintarVentas();
  }));

  const q = $('#q-sabor', v);
  if (q) q.addEventListener('input', () => {
    estado.buscaSabor = q.value;
    pintarVentas();
    const nuevo = $('#q-sabor');
    if (nuevo){ nuevo.focus(); nuevo.setSelectionRange(nuevo.value.length, nuevo.value.length) }
  });

  const cobrar = $('#btn-cobrar', v);
  if (cobrar) cobrar.addEventListener('click', modalCobro);

  const vaciar = $('#btn-vaciar', v);
  if (vaciar) vaciar.addEventListener('click', () => {
    estado.carrito = [];
    estado.saboresSel = [];
    pintarVentas();
  });
}

/* --- Cobro ---------------------------------------------------------------
   El total ocupa media pantalla a propósito: es lo que se le dice en voz
   alta al cliente y lo que hay que verificar antes de tocar nada. */
function modalCobro(){
  const total = totalCarrito();
  abrirModal(
    '<div class="arco-cab"><p>A cobrar</p>' +
      '<h3 id="modal-titulo" style="font-family:var(--f-dato); font-weight:500; font-size:var(--t-5); letter-spacing:-.02em">' +
        plata(total) + '</h3></div>' +
    '<div class="modal__cuerpo" style="display:grid; gap:var(--e-2)">' +
      '<div>' +
        '<div class="campo__et" style="margin-bottom:.4rem">Cómo paga</div>' +
        '<div class="pildoras" id="pagos">' +
          ['efectivo','debito','transferencia','cuenta'].map((p, i) =>
            '<button class="pildora" data-pago="' + p + '" aria-pressed="' + (i === 0) + '">' +
              ({ efectivo:'Efectivo', debito:'Débito / crédito', transferencia:'Transferencia', cuenta:'A cuenta' })[p] +
            '</button>').join('') +
        '</div>' +
      '</div>' +
      '<div id="extra-pago"></div>' +
    '</div>' +
    '<div class="modal__pie">' +
      '<button class="btn btn--fantasma" onclick="cerrarModal()">Volver</button>' +
      '<button class="btn btn--principal btn--grande" id="confirmar-cobro">Confirmar venta</button>' +
    '</div>'
  );

  let pago = 'efectivo';
  const extra = $('#extra-pago');

  function pintarExtra(){
    if (pago === 'efectivo'){
      extra.innerHTML =
        '<div class="campo"><label class="campo__et" for="paga-con">Paga con</label>' +
        '<input id="paga-con" type="text" inputmode="numeric" placeholder="0"></div>' +
        '<div id="vuelto" style="margin-top:.6rem; font-size:var(--t-1)"></div>';
      const inp = $('#paga-con');
      inp.addEventListener('input', () => {
        const con = parseFloat(inp.value.replace(/[^\d]/g, '')) || 0;
        $('#vuelto').innerHTML = con === 0 ? '' : con < total
          ? '<span style="color:var(--frutilla)">Falta ' + plata(total - con) + '</span>'
          : 'Vuelto: <strong>' + plata(con - total) + '</strong>';
      });
      inp.focus();
    } else if (pago === 'cuenta'){
      const conCuenta = estado.clientes;
      extra.innerHTML =
        '<div class="campo"><label class="campo__et" for="cli">Cliente de cuenta corriente</label>' +
        '<select id="cli">' + conCuenta.map(c =>
          '<option value="' + c.id + '">' + esc(c.nombre) + (c.saldo > 0 ? ' — debe ' + c.saldo.toLocaleString('es-AR') : '') + '</option>'
        ).join('') + '</select></div>' +
        '<p style="font-size:var(--t--1); color:var(--cacao-suave); margin-top:.4rem">' +
          'La venta suma al saldo del cliente y no entra en la caja de efectivo.</p>';
    } else {
      extra.innerHTML = '<p style="font-size:var(--t--1); color:var(--cacao-suave)">' +
        'No entra en el efectivo del arqueo, pero sí en el total del día.</p>';
    }
  }
  pintarExtra();

  $$('[data-pago]').forEach(b => b.addEventListener('click', () => {
    pago = b.dataset.pago;
    $$('[data-pago]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    pintarExtra();
  }));

  $('#confirmar-cobro').addEventListener('click', () => {
    const cliId = pago === 'cuenta' && $('#cli') ? $('#cli').value : null;
    registrarVenta(pago, cliId);
    cerrarModal();
  });
}

/* Registrar la venta es lo único que toca varias partes del sistema a la vez:
   descuenta kilos, descuenta insumos, entra a la caja, y si es a cuenta suma
   al saldo del cliente. En producción esto va en una sola transacción del
   lado del servidor, nunca en varios updates sueltos desde el navegador. */
function registrarVenta(pago, clienteId){
  const total = totalCarrito();
  const hora  = new Date().toTimeString().slice(0, 5);

  estado.carrito.forEach(l => {
    const porSabor = (l.gramos / 1000) / l.sabores.length;
    l.sabores.forEach(id => {
      const s = sabor(id);
      s.kg = Math.max(0, +(s.kg - porSabor).toFixed(3));
    });
    const f = FORMATOS.find(x => x.id === l.formato);
    Object.entries(f.insumos).forEach(([iid, cant]) => {
      const ins = estado.insumos.find(x => x.id === iid);
      if (ins) ins.cant = Math.max(0, +(ins.cant - cant).toFixed(2));
    });
  });

  const venta = {
    id: 1041 + estado.ventas.length,
    hora, lineas:[...estado.carrito], total, pago,
    cliente: clienteId, anulada:false, cajero:'Ana',
  };
  estado.ventas.push(venta);

  if (pago === 'efectivo'){
    estado.caja.movimientos.push({ tipo:'venta', detalle:'Venta #' + venta.id, monto: total, hora });
  }
  if (clienteId){
    const c = estado.clientes.find(x => x.id === clienteId);
    if (c) c.saldo += total;
  }

  estado.carrito = [];
  estado.saboresSel = [];
  estado.formatoSel = null;
  refrescarGlobo();
  pintarVentas();
  avisar('Venta #' + venta.id + ' cobrada · ' + total.toLocaleString('es-AR'));
}

/* ============================================================================
   MÓDULO: HISTORIAL
   ============================================================================ */
function pintarHistorial(){

    (estado.filtroHist === v.pago && !v.anulada)
